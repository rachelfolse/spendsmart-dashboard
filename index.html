<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="SpendSmart Dashboard helps users track and manage expenses easily with a clean, responsive interface.">
<title>SpendSmart Dashboard</title>
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="js/app.js"></script>
</head>
<body>

<div class="dashboard__header">
    <img src="images/SpendSmartSubmark.png" alt="SpendSmart Logo" class="logo">
    <h1> Main Dashboard </h1>
    </div>
    <main>
    <div class="app">

      <div class="dashboard__expenses">
        <h2>Expenses:</h2>
        <ul id="expense-list" class="expense-list"></ul>
      </div>

      <div class="dashboard__summary">
        <h2>Total Expenses:</h2>
        <p class="total">$<span id="total">0</span></p>
      </div>
  
      <div class="dashboard__actions">
        <a href="add-expense.html" class="button button--primary">
          Add Expense
        </a>
  
        <button id="clear" class="button button--primary">
          Clear All
        </button>
      </div>

</div>
    </main>
</body>
</html>
